name: CI测试流水线

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim
    steps:
      - uses: clone@v1
      - name: 安装依赖
        run: |
          pip install --no-cache-dir pytest requests -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: 运行测试
        run: pytest test_login.py -v
